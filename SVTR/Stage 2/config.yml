Global:
  use_gpu: true
  epoch_num: 35
  log_smooth_window: 20
  print_batch_step: 100
  save_model_dir: /kaggle/working/output/rec_svtr_handwritten_2stage/stage2
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 200
  cal_metric_during_train: true
  character_dict_path: /kaggle/working/manga109_dict.txt
  character_type: ch
  max_text_length: 100
  use_space_char: true
  distributed: false
  use_amp: true
  amp_level: O2
  use_ema: true
  ema_decay: 0.9999
  pretrained_model: /kaggle/working/output/rec_svtr_handwritten_2stage/stage1/best_accuracy
  freeze_backbone: false
Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.99
  epsilon: 8.0e-08
  weight_decay: 0.1
  lr:
    name: Cosine
    learning_rate: 5.0e-05
    warmup_epoch: 5
Architecture:
  model_type: rec
  algorithm: SVTR
  Transform: null
  Backbone:
    name: SVTRNet
    img_size:
    - 48
    - 800
    drop_rate: 0.1
    out_char_num: 200
    out_channels: 256
    patch_merging: Conv
    embed_dim:
    - 128
    - 256
    - 384
    depth:
    - 3
    - 6
    - 9
    num_heads:
    - 4
    - 8
    - 12
    mixer:
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    local_mixer:
    - - 7
      - 11
    - - 7
      - 11
    - - 7
      - 11
    last_stage: true
    prenorm: false
  Neck:
    name: SequenceEncoder
    encoder_type: reshape
  Head:
    name: CTCHead
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/input/datasets/khangphantrnvn/uit-handwriten-dataset/UIT_HWDB_line_converted/train_data
    label_file_list:
    - /kaggle/working/rec_gt_train_split.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - HandwritingAug:
        aug_prob: 0.5
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 800
        padding: true
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    drop_last: true
    batch_size_per_card: 16
    num_workers: 8
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/input/datasets/khangphantrnvn/uit-handwriten-dataset/UIT_HWDB_line_converted/train_data
    label_file_list:
    - /kaggle/working/rec_gt_val_split.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 800
        padding: true
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
profiler_options: null
