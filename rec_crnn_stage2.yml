# Cau hinh inference CRNN cho PaddleOCR (tools/infer_rec.py).
# Cac duong dan (pretrained_model, character_dict_path, infer_img,
# rec_image_shape) duoc ghi de luc chay boi viz/backend/inference.py.

Global:
  use_gpu: true
  character_dict_path: vietnamses_dict.txt
  max_text_length: 100
  use_space_char: true
  infer_mode: false
Architecture:
  model_type: rec
  algorithm: CRNN
  Transform: null
  Backbone:
    name: ResNet
    layers: 34
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 256
  Head:
    name: CTCHead
    fc_decay: 0
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 800
    - KeepKeys:
        keep_keys:
        - image
