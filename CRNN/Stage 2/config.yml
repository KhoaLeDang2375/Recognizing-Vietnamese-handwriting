Global:
  use_gpu: true
  distributed: true
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /kaggle/working/exp_crnn_uit_hwdb/stage2
  save_epoch_step: 10
  eval_batch_step:
  - 0
  - 500
  cal_metric_during_train: true
  pretrained_model: /kaggle/working/exp_crnn_uit_hwdb/stage1/best_accuracy
  character_dict_path: /kaggle/working/exp_crnn_uit_hwdb/data/dict_vietnamese.txt
  max_text_length: 100
  infer_mode: false
  use_space_char: true
  save_res_path: /kaggle/working/exp_crnn_uit_hwdb/predicts.txt
  seed: 2026
  freeze_backbone: false
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 5.0e-05
    warmup_epoch: 3
  regularizer:
    name: L2
    factor: 0.0001
Architecture:
  model_type: rec
  algorithm: CRNN
  Transform: null
  Backbone:
    name: ResNet
    layers: 34
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 256
  Head:
    name: CTCHead
    fc_decay: 0
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/input/datasets/khangphantrnvn/uit-handwriten-dataset/UIT_HWDB_line_converted/train_data
    label_file_list:
    - /kaggle/working/exp_crnn_uit_hwdb/data/rec_gt_train_split.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - HandwritingAug:
        aug_prob: 0.8
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 32
        - 640
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 4
    use_shared_memory: true
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/input/datasets/khangphantrnvn/uit-handwriten-dataset/UIT_HWDB_line_converted/train_data
    label_file_list:
    - /kaggle/working/exp_crnn_uit_hwdb/data/rec_gt_val_split.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 32
        - 640
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 4
    use_shared_memory: true
profiler_options: null
