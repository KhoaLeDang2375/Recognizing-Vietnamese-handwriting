# Cau hinh inference SVTR cho PaddleOCR (tools/infer_rec.py).
# Cac duong dan (pretrained_model, character_dict_path, infer_img,
# rec_image_shape) duoc ghi de luc chay boi viz/backend/inference.py.

Global:
  use_gpu: true
  character_dict_path: vietnamses_dict.txt
  character_type: ch
  max_text_length: 100
  use_space_char: true
  infer_mode: true
Architecture:
  model_type: rec
  algorithm: SVTR
  Transform: null
  Backbone:
    name: SVTRNet
    img_size:
    - 48
    - 800
    drop_rate: 0.1
    out_char_num: 200
    out_channels: 256
    patch_merging: Conv
    embed_dim:
    - 128
    - 256
    - 384
    depth:
    - 3
    - 6
    - 9
    num_heads:
    - 4
    - 8
    - 12
    mixer:
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Local
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    - Global
    local_mixer:
    - - 7
      - 11
    - - 7
      - 11
    - - 7
      - 11
    last_stage: true
    prenorm: false
  Neck:
    name: SequenceEncoder
    encoder_type: reshape
  Head:
    name: CTCHead
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 800
        padding: true
    - KeepKeys:
        keep_keys:
        - image
